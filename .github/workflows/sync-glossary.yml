name: Sync glossary

# Mirrors the approved Thumbtack ES glossary from the Apps Script endpoint into this
# repo so tt-ai-translation-tool can fetch it from GitHub (which claude.ai's sandbox
# allows) instead of script.google.com (which it blocks).

on:
  schedule:
    - cron: "0 13 * * *" # daily at 13:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch glossary from Apps Script
        env:
          GLOSSARY_URL: https://script.google.com/macros/s/AKfycbxbORV7ZpK1MdepVI__yFLzxMj7RZRF48kdTZ4TZI5qZp7d836UspO5F8_5TuHPtiNUmA/exec
        run: |
          set -euo pipefail
          curl -sSL -m 60 "${GLOSSARY_URL}?mode=glossary" -o glossary.raw.json
          # Validate, drop status=rejected so the skill never applies them, and stamp
          # the payload as generated so nobody hand-edits it. The stamp is a constant
          # string (no timestamp) to preserve "commit only if changed".
          python3 -c "import json; d=json.load(open('glossary.raw.json')); assert d.get('ok') and d.get('terms'), 'bad payload'; d['terms']=[t for t in d['terms'] if (t.get('status') or '').lower()!='rejected']; d['count']=len(d['terms']); d['_generated']='DO NOT EDIT - synced from the Localization Auditor via Apps Script mode=glossary. Add or change terms in that app, not here.'; json.dump(d, open('glossary.json','w'), ensure_ascii=False, indent=2); print('kept', d['count'], 'terms (rejected dropped)')"
          rm -f glossary.raw.json

      - name: Regenerate glossary.md
        run: python3 scripts/build_md.py

      - name: Fetch url_index + slug_aliases, build link map, aliases + master book
        env:
          URL_INDEX_CSV: "https://docs.google.com/spreadsheets/d/16X-I4oT-W96XTwx1qs7ErqTAT6sJI7du3_vnYFp9MIo/export?format=csv&gid=1087407530"
          SLUG_ALIASES_CSV: "https://docs.google.com/spreadsheets/d/16X-I4oT-W96XTwx1qs7ErqTAT6sJI7du3_vnYFp9MIo/export?format=csv&gid=1881652000"
          EXEC_URL: "https://script.google.com/macros/s/AKfycbxbORV7ZpK1MdepVI__yFLzxMj7RZRF48kdTZ4TZI5qZp7d836UspO5F8_5TuHPtiNUmA/exec"
        run: |
          set -euo pipefail
          curl -sSL -m 60 "$URL_INDEX_CSV" -o url_index.csv
          head -1 url_index.csv | grep -q "translationKey" # sanity: CSV, not a login page
          curl -sSL -m 60 "$SLUG_ALIASES_CSV" -o slug_aliases.csv
          head -1 slug_aliases.csv | grep -q "oldSlug"      # sanity
          python3 scripts/build_articles.py url_index.csv
          python3 scripts/build_aliases.py slug_aliases.csv
          python3 scripts/build_masterbook.py "$EXEC_URL" url_index.csv
          rm -f url_index.csv slug_aliases.csv

      - name: Rebuild the manifest
        run: python3 scripts/build_index.py

      - name: Commit if changed
        run: |
          git config user.name "glossary-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add glossary.json glossary.md articles.json aliases.json masterbook.json index.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync glossary + article link map ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
