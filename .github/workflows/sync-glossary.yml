name: Sync glossary

# Mirrors the approved Thumbtack ES glossary from the Apps Script endpoint into this
# repo so tt-ai-translation-tool can fetch it from GitHub (which claude.ai's sandbox
# allows) instead of script.google.com (which it blocks).

on:
  schedule:
    - cron: "0 13 * * *" # daily at 13:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch glossary from Apps Script
        env:
          GLOSSARY_URL: https://script.google.com/macros/s/AKfycbxbORV7ZpK1MdepVI__yFLzxMj7RZRF48kdTZ4TZI5qZp7d836UspO5F8_5TuHPtiNUmA/exec
        run: |
          set -euo pipefail
          curl -sSL -m 60 "${GLOSSARY_URL}?mode=glossary" -o glossary.raw.json
          # Validate the response is the expected JSON before overwriting anything.
          python3 -c "import json; d=json.load(open('glossary.raw.json')); assert d.get('ok') and d.get('terms'), 'bad payload'; json.dump(d, open('glossary.json','w'), ensure_ascii=False, indent=2); print('fetched', d['count'], 'terms')"
          rm -f glossary.raw.json

      - name: Regenerate glossary.md
        run: python3 scripts/build_md.py

      - name: Commit if changed
        run: |
          git config user.name "glossary-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add glossary.json glossary.md
          if git diff --cached --quiet; then
            echo "No glossary changes."
          else
            git commit -m "Sync glossary ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
